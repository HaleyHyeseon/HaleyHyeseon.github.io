<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>진행자 페이지</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="slides.js"></script>
</head>
<body class="host">

  <header class="bar">
    <div><span class="label">참가 코드</span><strong id="code">----</strong></div>
    <div><span class="label">접속한 참가자</span><strong id="count">0</strong>명</div>
    <div id="status" class="status">연결 중...</div>
  </header>

  <div class="layout">
    <main>
      <div id="stage" class="stage inline"></div>
      <div class="controls">
        <button id="prev" class="ghost">이전</button>
        <span id="pos"></span>
        <button id="next">다음</button>
        <button id="hide" class="ghost">참가자 화면 가리기</button>
      </div>
      <p class="hint">키보드: ← → (또는 스페이스)로 넘기기, B로 화면 가리기</p>
    </main>

    <aside class="side">
      <section>
        <h3>참가자 접속 방법</h3>
        <div class="linkrow">
          <input id="link" readonly>
          <button id="copy" class="ghost">복사</button>
        </div>
      </section>
      <section>
        <h3>진행 메모 (진행자만 보임)</h3>
        <p id="note"></p>
      </section>
      <section>
        <h3>다음 슬라이드</h3>
        <div id="nextStage" class="stage inline"></div>
      </section>
    </aside>
  </div>

<script>
  const PREFIX = 'ghpages-slides-';
  const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 헷갈리는 글자(0/O, 1/I) 제외
  const $ = id => document.getElementById(id);

  function makeCode() {
    let s = '';
    for (let i = 0; i < 4; i++) s += CHARS[Math.floor(Math.random() * CHARS.length)];
    return s;
  }

  let code = localStorage.getItem('roomCode') || makeCode();
  let index = 0;
  let hidden = false;
  let peer = null;
  let sameCodeRetries = 0;
  const conns = new Set();

  // 이미지 미리 불러오기 (넘길 때 바로 뜨도록)
  SLIDES.forEach(s => {
    for (const m of s.html.matchAll(/src="([^"]+)"/g)) new Image().src = m[1];
  });

  function state() { return { type: 'state', index, hidden }; }
  function broadcast() { conns.forEach(c => c.open && c.send(state())); }

  function render() {
    const cur = SLIDES[index];
    const next = SLIDES[index + 1];
    $('stage').innerHTML = cur.html;
    $('nextStage').innerHTML = next ? next.html : '<p>마지막 슬라이드입니다</p>';
    $('note').textContent = cur.note || '(메모 없음)';
    $('pos').textContent = (index + 1) + ' / ' + SLIDES.length;
    $('prev').disabled = index === 0;
    $('next').disabled = index === SLIDES.length - 1;
    $('hide').textContent = hidden ? '참가자 화면 다시 보이기' : '참가자 화면 가리기';
    $('hide').classList.toggle('on', hidden);
  }

  function go(n) {
    index = Math.max(0, Math.min(SLIDES.length - 1, n));
    render();
    broadcast();
  }

  function toggleHide() {
    hidden = !hidden;
    render();
    broadcast();
  }

  function updateCount() { $('count').textContent = [...conns].filter(c => c.open).length; }
  function setStatus(t) { $('status').textContent = t; }

  function showRoom() {
    $('code').textContent = code;
    const url = new URL('index.html?room=' + code, location.href).href;
    $('link').value = url;
  }

  function startPeer() {
    showRoom();
    setStatus('연결 중...');
    peer = new Peer(PREFIX + code);

    peer.on('open', () => {
      localStorage.setItem('roomCode', code);
      sameCodeRetries = 0;
      setStatus('준비 완료 · 참가자를 기다리는 중');
    });

    peer.on('connection', conn => {
      conn.on('open', () => {
        conns.add(conn);
        updateCount();
        conn.send(state()); // 새로 들어온 사람에게 현재 화면 전달
      });
      conn.on('close', () => { conns.delete(conn); updateCount(); });
      conn.on('error', () => { conns.delete(conn); updateCount(); });
    });

    peer.on('disconnected', () => { setStatus('서버와 끊김, 재연결 중...'); peer.reconnect(); });

    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        // 새로고침 직후엔 이전 연결이 잠시 남아있을 수 있어 같은 코드로 몇 번 재시도
        peer.destroy();
        if (sameCodeRetries < 3) {
          sameCodeRetries++;
          setTimeout(startPeer, 2500);
        } else {
          code = makeCode();
          sameCodeRetries = 0;
          startPeer();
        }
      } else {
        setStatus('연결 오류: ' + err.type);
      }
    });
  }

  $('prev').onclick = () => go(index - 1);
  $('next').onclick = () => go(index + 1);
  $('hide').onclick = toggleHide;
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText($('link').value); $('copy').textContent = '복사됨'; }
    catch { $('link').select(); }
    setTimeout(() => $('copy').textContent = '복사', 1500);
  };

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(index + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(index - 1); }
    else if (e.key === 'b' || e.key === 'B') toggleHide();
  });

  render();
  startPeer();
</script>
</body>
</html>
